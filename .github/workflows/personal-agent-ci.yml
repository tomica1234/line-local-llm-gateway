name: Personal Agent CI

on:
  push:
    paths:
      - "personal-agent/**"
      - ".github/workflows/personal-agent-ci.yml"
  pull_request:
    paths:
      - "personal-agent/**"
      - ".github/workflows/personal-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: personal-agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: personal-agent/requirements.lock
      - name: Install package and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Local E2E profile
        run: pytest -m e2e
      - name: Compile package
        run: python -m compileall -q src

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personal-agent/requirements.lock
      - name: Install locked runtime and scanners
        run: |
          python -m pip install -r requirements.lock
          python -m pip install bandit detect-secrets pip-audit
          python -m pip install --no-deps -e .
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock
      - name: Static security scan
        # Fail CI on high-severity findings. Lower-severity findings include the reviewed,
        # typed subprocess wrappers and parameterized dynamic SQLite placeholder counts.
        run: bandit -q -lll -r src/personal_agent
      - name: Secret scan
        run: git ls-files -z src scripts | xargs -0 detect-secrets-hook
