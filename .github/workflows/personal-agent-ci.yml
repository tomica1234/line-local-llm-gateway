name: Personal Agent CI

on:
  push:
    paths:
      - "personal-agent/**"
      - ".github/workflows/personal-agent-ci.yml"
  pull_request:
    paths:
      - "personal-agent/**"
      - ".github/workflows/personal-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: personal-agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: personal-agent/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Compile package
        run: python -m compileall -q src
